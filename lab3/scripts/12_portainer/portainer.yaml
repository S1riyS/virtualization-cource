services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: lab3-portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:z
      - portainer_data:/data

volumes:
  portainer_data:
